<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, td{
            border: solid black;
        }
    </style>
</head>
<body>
    <table> <!--Začátek tabulky-->
        <tr>
            <th>Záhlaví 1</th>
            <th>Záhlaví 2</th>
        </tr>
        <tr> <!--Začátek řádku v tabulce-->
            <td>Řádek 1 Sloupec 1</td> <!--Buňka v tabulce-->
            <td>Řádek 1 Sloupec 2</td>
        </tr>
        <tr>
            <td colspan="2">Řádek 2 Sloupec 1</td>
            
        </tr>
    </table>
</body>
</html>
